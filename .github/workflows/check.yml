name: Check CleanOS
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android release tools
        run: |
          python -m py_compile scripts/prepare-android-signing.py .github/scripts/sign-android-candidate.py
          python -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:android
