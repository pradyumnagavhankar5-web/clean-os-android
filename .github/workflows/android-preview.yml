name: Build CleanOS shared Android candidate

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/shared-workspaces']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
      - '.github/workflows/android-preview.yml'
      - '.github/scripts/verify-preview-apks.py'
      - '.github/scripts/check-shared-launch.sh'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pradyumnagavhankar5-web/clean-os-android' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/shared-workspaces')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate APK verification script
        run: python -m py_compile .github/scripts/verify-preview-apks.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript, lint and tests
        run: npm run check

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties
            package-lock.json

      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.30.5'
          log-accepted-android-sdk-licenses: false

      - name: Resolve the API 37 platform path
        run: |
          # Google publishes API 37 as android-37.0. Some Gradle integrations
          # still resolve compileSdk 37 through the integer android-37 path.
          python - <<'PY'
          import os
          from pathlib import Path

          platforms = Path(os.environ['ANDROID_HOME']) / 'platforms'
          official = platforms / 'android-37.0'
          properties = dict(line.split('=', 1) for line in
                            (official / 'source.properties').read_text().splitlines()
                            if '=' in line and not line.lstrip().startswith('#'))
          properties = {key.strip(): value.strip() for key, value in properties.items()}
          api_level = properties.get('AndroidVersion.ApiLevel')
          if api_level not in {'37', '37.0'} or not (official / 'android.jar').is_file():
              raise SystemExit('The installed platform is not the official Android API 37 SDK.')
          compatible = platforms / 'android-37'
          if not compatible.exists():
              compatible.symlink_to(official.name, target_is_directory=True)
          if not (compatible / 'android.jar').is_file():
              raise SystemExit('Gradle cannot resolve the Android API 37 SDK.')
          print(f'Official API {api_level} SDK installed; Gradle API 37 path is available.')
          PY

      - name: Build the recommended APK for modern phones
        working-directory: android
        run: |
          chmod +x gradlew
          # Both builds use the same generated project and preview signing key.
          # Stage this APK before the next ABI build replaces app-release.apk.
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            -Pandroid.cmakeVersion=3.30.5 \
            -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/CleanOS-team-preview.apk

      - name: Build the older-device compatibility APK
        working-directory: android
        run: |
          # Reuse the same native project, key and caches; do not clean between ABIs.
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            -Pandroid.cmakeVersion=3.30.5 \
            -PreactNativeArchitectures=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/CleanOS-team-preview-armv7.apk

      - name: Build the emulator installation test
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            -Pandroid.cmakeVersion=3.30.5 \
            -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/CleanOS-emulator.apk

      - name: Verify and package APKs
        run: |
          build_tools="${ANDROID_HOME}/build-tools/37.0.0"
          for filename in CleanOS-team-preview.apk CleanOS-team-preview-armv7.apk CleanOS-emulator.apk; do
            apk="artifacts/$filename"
            prefix="${filename%.apk}"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
              > "artifacts/$prefix-signature.txt"
            "$build_tools/aapt2" dump badging "$apk" \
              > "artifacts/$prefix-manifest.txt"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk" \
              > "artifacts/$prefix-alignment.txt"
          done
          python .github/scripts/verify-preview-apks.py
          (
            cd artifacts
            sha256sum CleanOS-team-preview.apk > CleanOS-team-preview.apk.sha256
            sha256sum CleanOS-team-preview-armv7.apk > CleanOS-team-preview-armv7.apk.sha256
            sha256sum CleanOS-emulator.apk > CleanOS-emulator.apk.sha256
          )

      - name: Save verified APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cleanos-android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test database permissions and concurrent stock transactions
        run: bash scripts/test-database.sh

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cleanos-android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the real-account app on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/check-shared-launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanos-shared-launch-${{ github.run_id }}
          path: emulator-evidence/
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [build, database, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: cleanos-android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts

      - name: Publish both preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd artifacts
            sha256sum --check CleanOS-team-preview.apk.sha256
            sha256sum --check CleanOS-team-preview-armv7.apk.sha256
          )
          preview_tag="shared-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          cat > release-notes.md <<EOF
          ## Choose one CleanOS download

          - **Recommended: CleanOS-team-preview.apk** — the smaller build for most current Android phones and tablets.
          - **Older-device compatibility: CleanOS-team-preview-armv7.apk** — try this if your older Android device cannot install the recommended download.

          These are two variants of the same shared CleanOS app. Both require Android 7 or newer. Real sign-in and a configured Supabase database are required. Install this alongside the earlier demo; it uses a separate Android package and starts with your real account.

          Download the file you need, then open it on your phone. Android may ask you to allow installation from the browser. Each APK has its own SHA-256 checksum file.

          Both APKs use the Expo template generic debug signing key for acceptance testing. Owner-controlled signing and the shared release checklist are required before production distribution. Setup: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/SUPABASE_SETUP.md

          Source commit: ${GITHUB_SHA}
          Automated checks, database permissions/concurrency tests, APK signature/architecture/16 KiB alignment, and an Android 16 x86_64 emulator install/real-sign-in-screen test passed. ARM phone installation and real account/multiple-phone acceptance tests must still be performed; this workflow does not sign in, register users or send email.
          EOF
          gh release create "$preview_tag" \
            artifacts/CleanOS-team-preview.apk \
            artifacts/CleanOS-team-preview.apk.sha256 \
            artifacts/CleanOS-team-preview-armv7.apk \
            artifacts/CleanOS-team-preview-armv7.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CleanOS shared workspace candidate ${preview_tag}" \
            --prerelease \
            --notes-file release-notes.md
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${preview_tag}"
          printf '### CleanOS Android preview\n\n[Recommended APK for modern phones](%s/CleanOS-team-preview.apk)\n\n[Older-device compatibility APK](%s/CleanOS-team-preview-armv7.apk)\n\nSource commit: %s\n' \
            "$download_base" "$download_base" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
