name: Build Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
      - '.github/workflows/android-preview.yml'
      - '.github/scripts/verify-preview-apks.py'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pradyumnagavhankar5-web/clean-os-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate APK verification script
        run: python -m py_compile .github/scripts/verify-preview-apks.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript, lint and tests
        run: npm run check

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties
            package-lock.json

      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.30.5'
          log-accepted-android-sdk-licenses: false

      - name: Resolve the API 37 platform path
        run: |
          # Google publishes API 37 as android-37.0. Some Gradle integrations
          # still resolve compileSdk 37 through the integer android-37 path.
          python - <<'PY'
          import os
          from pathlib import Path

          platforms = Path(os.environ['ANDROID_HOME']) / 'platforms'
          official = platforms / 'android-37.0'
          properties = dict(line.split('=', 1) for line in
                            (official / 'source.properties').read_text().splitlines()
                            if '=' in line and not line.lstrip().startswith('#'))
          properties = {key.strip(): value.strip() for key, value in properties.items()}
          api_level = properties.get('AndroidVersion.ApiLevel')
          if api_level not in {'37', '37.0'} or not (official / 'android.jar').is_file():
              raise SystemExit('The installed platform is not the official Android API 37 SDK.')
          compatible = platforms / 'android-37'
          if not compatible.exists():
              compatible.symlink_to(official.name, target_is_directory=True)
          if not (compatible / 'android.jar').is_file():
              raise SystemExit('Gradle cannot resolve the Android API 37 SDK.')
          print(f'Official API {api_level} SDK installed; Gradle API 37 path is available.')
          PY

      - name: Build the recommended APK for modern phones
        working-directory: android
        run: |
          chmod +x gradlew
          # Both builds use the same generated project and preview signing key.
          # Stage this APK before the next ABI build replaces app-release.apk.
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            -Pandroid.cmakeVersion=3.30.5 \
            -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/CleanOS-preview.apk

      - name: Build the older-device compatibility APK
        working-directory: android
        run: |
          # Reuse the same native project, key and caches; do not clean between ABIs.
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            -Pandroid.cmakeVersion=3.30.5 \
            -PreactNativeArchitectures=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/CleanOS-preview-armv7.apk

      - name: Verify and package both APKs
        run: |
          build_tools="${ANDROID_HOME}/build-tools/37.0.0"
          for filename in CleanOS-preview.apk CleanOS-preview-armv7.apk; do
            apk="artifacts/$filename"
            prefix="${filename%.apk}"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
              > "artifacts/$prefix-signature.txt"
            "$build_tools/aapt2" dump badging "$apk" \
              > "artifacts/$prefix-manifest.txt"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk" \
              > "artifacts/$prefix-alignment.txt"
          done
          python .github/scripts/verify-preview-apks.py
          (
            cd artifacts
            sha256sum CleanOS-preview.apk > CleanOS-preview.apk.sha256
            sha256sum CleanOS-preview-armv7.apk > CleanOS-preview-armv7.apk.sha256
          )

      - name: Save verified APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cleanos-android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: cleanos-android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts

      - name: Publish both preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd artifacts
            sha256sum --check CleanOS-preview.apk.sha256
            sha256sum --check CleanOS-preview-armv7.apk.sha256
          )
          preview_tag="android-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          cat > release-notes.md <<EOF
          ## Choose one CleanOS download

          - **Recommended: CleanOS-preview.apk** — the smaller build for most current Android phones and tablets.
          - **Older-device compatibility: CleanOS-preview-armv7.apk** — try this if your older Android device cannot install the recommended download.

          These are two variants of the same CleanOS version. Both require Android 7 or newer and include the app's JavaScript. Expo Go, an Expo account, a development server and a backend connection are not needed to use the local demo.

          Download the file you need, then open it on your phone. Android may ask you to allow installation from the browser. Each APK has its own SHA-256 checksum file.

          Both APKs use the same Expo template generic debug signing key and are intended for preview testing. They are not Play Store production releases.

          Source commit: ${GITHUB_SHA}
          Automated checks and each APK's signature, package, version, single architecture, embedded JavaScript and ZIP alignment were verified. The recommended APK's ARM64 native libraries also passed ELF PT_LOAD alignment checks for 16 KiB pages. Physical Android device testing has not been performed by this workflow.
          EOF
          gh release create "$preview_tag" \
            artifacts/CleanOS-preview.apk \
            artifacts/CleanOS-preview.apk.sha256 \
            artifacts/CleanOS-preview-armv7.apk \
            artifacts/CleanOS-preview-armv7.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CleanOS Android preview ${preview_tag}" \
            --prerelease \
            --notes-file release-notes.md
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${preview_tag}"
          printf '### CleanOS Android preview\n\n[Recommended APK for modern phones](%s/CleanOS-preview.apk)\n\n[Older-device compatibility APK](%s/CleanOS-preview-armv7.apk)\n\nSource commit: %s\n' \
            "$download_base" "$download_base" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
